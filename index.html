<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BlattaLab｜蜚蠊介紹與販售 - 專業蟑螂寵物飼養指南</title>
  <meta name="description" content="BlattaLab 專注於蜚蠊（Blattodea）的研究、繁育與教育推廣。提供科學化的物種資訊與飼養建議，並提供購買服務。" />
  <meta property="og:title" content="BlattaLab｜蜚蠊介紹與販售" />
  <meta property="og:description" content="專業蜚蠊研究與飼養指南，提供多種寵物蟑螂品種介紹與購買服務" />
  <meta property="og:image" content="images/cover.jpg" />
  <meta property="og:url" content="https://yourdomain.github.io/" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="BlattaLab" />
  <link rel="icon" type="image/png" href="images/logo.png" />
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <header>
    <div class="nav container">
      <div class="brand">
        <div class="logo">
          <img src="images/logo.png" alt="BlattaLab 品牌標誌" />
        </div>
        <span>BlattaLab</span>
      </div>
      <nav style="margin-left:auto;display:flex;gap:8px;flex-wrap:wrap">
        <a href="#home">首頁</a>
        <a href="#genus">屬別瀏覽</a>
        <a href="#guide">難度星級</a>
        <a href="#about">關於我們</a>
      </nav>
    </div>
  </header>

  <main id="home" class="container">
    <section class="hero">
      <h1>蜚蠊的科學與美學</h1>
      <p>從 Blattodea 到 Lab —— 以研究級資料與設計，呈現蜚蠊的生態價值與飼養知識。</p>

      <!-- 社群連結 -->
      <ul class="social-links">
        <li>
          <a href="https://www.facebook.com/your-page" class="social-link" target="_blank">
            Facebook 粉絲專頁
          </a>
        </li>
        <li>
          <a href="https://www.instagram.com/your-account" class="social-link" target="_blank">
            Instagram
          </a>
        </li>
      </ul>

      <!-- 統計 -->
      <div class="stats">
        <div class="stat-item">
          <span class="stat-number" id="species-count">0</span>
          <div class="stat-label">物種數量</div>
        </div>
        <div class="stat-item">
          <span class="stat-number" id="genus-count">0</span>
          <div class="stat-label">屬別種類</div>
        </div>
        <div class="stat-item">
          <span class="stat-number" id="in-stock-count">0</span>
          <div class="stat-label">現貨品種</div>
        </div>
      </div>
    </section>

    <!-- 篩選工具 -->
    <section class="toolbar">
      <div class="search-container">
        <input id="q" type="search" class="search-input" placeholder="搜尋學名 / 中文名…" />
      </div>
      <select id="difficulty">
        <option value="">難度：不限</option>
        <option value="1">★☆☆☆☆</option>
        <option value="2">★★☆☆☆</option>
        <option value="3">★★★☆☆</option>
        <option value="4">★★★★☆</option>
        <option value="5">★★★★★</option>
      </select>
      <button class="chip" data-tag="現貨" type="button">現貨</button>
      <button class="chip" data-tag="缺貨" type="button">缺貨</button>
    </section>

    <!-- 物種卡片 -->
    <section id="genus">
      <div class="section-title">
        <h2>全部物種</h2>
        <div class="count" id="count">0 筆</div>
      </div>
      <div class="grid" id="grid"></div>
    </section>
  </main>

  <footer class="container">
    <div>© <span id="year"></span> BlattaLab. All rights reserved.</div>
  </footer>

  <script src="app.js"></script>
</body>
</html>
